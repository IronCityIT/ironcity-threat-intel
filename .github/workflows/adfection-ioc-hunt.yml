name: ICIT AdFection IOC Hunt

on:
  push:
    paths:
      - '.github/workflows/adfection-ioc-hunt.yml'

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.WAZUH_SSH_KEY }}
      HOST: ${{ secrets.WAZUH_HOST }}
      USER: ${{ secrets.WAZUH_USER }}
    steps:
      - name: Verify restricted SSH credential
        shell: bash
        run: |
          set -euo pipefail
          for n in KEY HOST USER; do
            eval "v=\${$n:-}"
            if [ -z "$v" ]; then echo "::error::WAZUH_$n is not set"; exit 1; fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/wazuh
          chmod 600 ~/.ssh/wazuh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run count-only AdFection hunt
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/wazuh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" 'bash -s' <<'REMOTE' > adfection-hunt-receipt.json
          set -euo pipefail
          umask 077
          START="2026-07-20T00:00:00Z"
          END="$(date -u +%FT%TZ)"
          CURLRC="/etc/icit-indexer.curlrc"
          test -r "$CURLRC"

          mapfile -t INDICATORS <<'EOF'
          255869de85e2a171993fc5eb8a556d873a1b8966e040f6f55926f2fa2d595cc8
          keyadapter.com
          sharethere.net
          fearevolve.com
          insightenterprisells.com
          jobmarcher.com
          plasticbells.com
          EOF

          INDICES_JSON="$(curl -sk --config "$CURLRC" --max-time 20 'https://127.0.0.1:9200/_cat/indices/wazuh-alerts-*?format=json&h=index')"
          INDICES_COUNT="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"$INDICES_JSON")"
          CLUSTER_STATUS="$(curl -sk --config "$CURLRC" --max-time 20 'https://127.0.0.1:9200/_cluster/health?filter_path=status' | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))')"

          COUNTS=()
          for indicator in "${INDICATORS[@]}"; do
            BODY="$(python3 - "$indicator" "$START" "$END" <<'PY'
          import json,sys
          indicator,start,end=sys.argv[1:]
          print(json.dumps({"query":{"bool":{"filter":[{"range":{"@timestamp":{"gte":start,"lte":end}}}],"must":[{"simple_query_string":{"query":'"'+indicator+'"',"fields":["*"],"default_operator":"and"}}]}}}))
          PY
          )"
            COUNT="$(curl -sk --config "$CURLRC" --max-time 30 -H 'Content-Type: application/json' --data-binary "$BODY" 'https://127.0.0.1:9200/wazuh-alerts-*/_count' | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["count"])')"
            COUNTS+=("$COUNT")
          done

          python3 - "$START" "$END" "$INDICES_COUNT" "$CLUSTER_STATUS" "${COUNTS[@]}" <<'PY'
          import json,sys
          start,end,indices_count,cluster_status,*counts=sys.argv[1:]
          indicators=[
            "255869de85e2a171993fc5eb8a556d873a1b8966e040f6f55926f2fa2d595cc8",
            "keyadapter.com","sharethere.net","fearevolve.com",
            "insightenterprisells.com","jobmarcher.com","plasticbells.com"
          ]
          print(json.dumps({
            "task_id":"ICIT-SEC-20261018-ADFECTION-IOC-HUNT",
            "status":"COMPLETE",
            "repo_path":"Sentinel:wazuh-alerts-*",
            "query_mode":"read-only count-only",
            "time_window":{"gte":start,"lte":end},
            "data_sources":{"index_pattern":"wazuh-alerts-*","matched_indices":int(indices_count),"cluster_status":cluster_status},
            "indicator_results":[{"indicator":i,"confidence":"high","hit_count":int(c)} for i,c in zip(indicators,counts)],
            "interpretation":"A hit is a telemetry match requiring review; it is not by itself proof of exploitation. Broad ad-infrastructure domains were intentionally excluded.",
            "tests":["restricted SSH credential accepted","indexer query authenticated","seven count queries completed"],
            "evidence":"count-only receipt; no raw events exported",
            "changes":"none",
            "completed_at":end
          },separators=(",",":")))
          PY
          REMOTE

      - name: Validate receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("adfection-hunt-receipt.json",encoding="utf-8"))
          assert p["status"]=="COMPLETE"
          assert len(p["indicator_results"])==7
          assert p["data_sources"]["matched_indices"]>0
          assert all(isinstance(x["hit_count"],int) for x in p["indicator_results"])
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: adfection-ioc-hunt-receipt
          path: adfection-hunt-receipt.json
          retention-days: 30

      - name: Remove key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/wazuh
