name: Collect Threat Intelligence Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  collect-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Collect AbuseIPDB
        env:
          ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
        run: python scripts/collect_abuseipdb.py

      - name: Collect AlienVault
        env:
          ALIENVAULT_KEY: ${{ secrets.ALIENVAULT_KEY }}
        run: python scripts/collect_alienvault.py

      - name: Collect GreyNoise
        env:
          GREYNOISE_KEY: ${{ secrets.GREYNOISE_KEY }}
        run: python scripts/collect_greynoise.py

      - name: Collect Spamhaus
        run: python scripts/collect_spamhaus.py

      - name: Collect URLhaus
        run: python scripts/collect_urlhaus.py

      - name: Collect Feodo
        run: python scripts/collect_feodo.py

      - name: Merge feeds
        run: python scripts/merge_feeds.py

      - name: Commit feeds to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feeds/
          git diff --staged --quiet || git commit -m "Update threat intel feeds $(date -u +%Y-%m-%d)"
          git push
